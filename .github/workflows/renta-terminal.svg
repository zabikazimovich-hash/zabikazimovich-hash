<svg width="100%" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>

    <clipPath id="clipLine1">
      <rect x="0" y="0" width="0" height="26">
        <animate attributeName="width" dur="6s" repeatCount="indefinite"
          keyTimes="0;0.2;0.9;1" values="0;470;470;0"/>
      </rect>
    </clipPath>

    <clipPath id="clipLine2">
      <rect x="0" y="0" width="0" height="26">
        <animate attributeName="width" dur="6s" repeatCount="indefinite"
          keyTimes="0;0.2;0.4;0.9;1" values="0;0;430;430;0"/>
      </rect>
    </clipPath>

    <clipPath id="clipLine3">
      <rect x="0" y="0" width="0" height="26">
        <animate attributeName="width" dur="6s" repeatCount="indefinite"
          keyTimes="0;0.4;0.6;0.9;1" values="0;0;520;520;0"/>
      </rect>
    </clipPath>
  </defs>

  <!-- terminal window -->
  <rect width="900" height="150" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="898" height="148" rx="13" fill="none" stroke="#ffffff1a" stroke-width="1"/>

  <!-- title bar -->
  <circle cx="26" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="26" r="6" fill="#27c93f"/>
  <text x="450" y="31" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#8CC5FF" text-anchor="middle">azizbek@dev: ~/renta-marketplace</text>
  <line x1="0" y1="46" x2="900" y2="46" stroke="#ffffff1f"/>

  <!-- line 1 -->
  <g font-family="Fira Code, Consolas, monospace" font-size="16">
    <text x="24" y="76" fill="#00c6ff" clip-path="url(#clipLine1)">$ git commit -m "fix RenTa booking calendar bug"</text>
  </g>

  <!-- line 2 -->
  <g font-family="Fira Code, Consolas, monospace" font-size="16">
    <text x="24" y="104" fill="#8CC5FF" clip-path="url(#clipLine2)">$ npm run build — RenTa v2.3</text>
  </g>

  <!-- line 3 -->
  <g font-family="Fira Code, Consolas, monospace" font-size="16">
    <text x="24" y="132" fill="#4ade80" clip-path="url(#clipLine3)">✓ Build successful — deploying to production...</text>
  </g>

  <!-- blinking cursor -->
  <rect x="24" y="118" width="9" height="16" fill="#4ade80">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.15;0.16;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
